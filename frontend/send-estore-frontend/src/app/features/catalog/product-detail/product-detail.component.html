<div class="product-detail-page">
  <div *ngIf="isLoading" class="text-center py-12">
    <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-r-2 border-gray-900 border-t-transparent border-l-blue-600" role="status">
      <span class="sr-only">Chargement...</span>
    </div>
  </div>

  <div *ngIf="!isLoading && product" class="product-detail-layout">
    <div class="product-media-card">
      <img
        [src]="getProductImage(product.imageUrl, product.id, product.name)"
        class="product-detail-image"
        style="display: block; width: 100%; height: 100%; max-width: 100%; max-height: 100%; object-fit: contain; object-position: center;"
        [alt]="product.name"
        (error)="onImageError($event)"
      >
    </div>
    <div class="product-info-panel">
      <h2 class="text-3xl font-bold text-gray-900 mb-2">{{ product.name }}</h2>
      <p class="text-gray-600 mb-4">Categorie: {{ product.categoryName }}</p>
      <p class="text-lg text-gray-700 mb-6">{{ product.description || 'Aucune description disponible.' }}</p>

      <div class="mb-6">
        <h4 class="text-2xl font-bold text-blue-600 mb-3">{{ formatPrice(product.price) }}</h4>
        <p class="mb-3" [ngClass]="!isInStock() ? 'text-red-600' : (inventory && inventory.quantity <= 5 ? 'text-yellow-600' : 'text-green-600')">
          {{ getStockStatus() }}
        </p>
      </div>

      <div class="bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-md mb-4" *ngIf="successMessage">
        {{ successMessage }}
      </div>

      <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-md mb-4" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <div class="quantity-panel mb-6" *ngIf="inventory && !isAdmin()">
        <label class="quantity-label" for="product-quantity">Quantite a reserver</label>
        <div class="quantity-control">
          <button
            type="button"
            class="quantity-button"
            (click)="decreaseQuantity()"
            [disabled]="selectedQuantity <= 1 || !isInStock() || isAddingToCart"
            aria-label="Diminuer la quantite"
          >
            -
          </button>
          <input
            id="product-quantity"
            class="quantity-input"
            type="number"
            min="1"
            [max]="getMaxQuantity()"
            [ngModel]="selectedQuantity"
            (ngModelChange)="onQuantityChange($event)"
            [disabled]="!isInStock() || isAddingToCart"
          >
          <button
            type="button"
            class="quantity-button"
            (click)="increaseQuantity()"
            [disabled]="selectedQuantity >= getMaxQuantity() || !isInStock() || isAddingToCart"
            aria-label="Augmenter la quantite"
          >
            +
          </button>
        </div>
        <p class="quantity-help" *ngIf="isInStock()">Maximum disponible: {{ getMaxQuantity() }}</p>
      </div>

      <div class="flex flex-col sm:flex-row gap-3">
        <button
          *ngIf="!isAdmin()"
          class="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors disabled:bg-gray-400 disabled:cursor-not-allowed text-lg font-medium"
          (click)="addToCart()"
          [disabled]="!canAddToCart() || isAddingToCart"
        >
          {{ isAddingToCart ? 'Ajout...' : 'Ajouter au panier' }}
        </button>

        <button
          *ngIf="isAdmin()"
          class="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors text-lg font-medium"
          (click)="goToAdmin()"
        >
          Gerer ce produit
        </button>

        <button
          class="bg-gray-600 text-white px-6 py-3 rounded-lg hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2 transition-colors text-lg font-medium"
          routerLink="/products"
        >
          Retour au catalogue
        </button>
      </div>
    </div>
  </div>

  <div *ngIf="!isLoading && !product" class="text-center py-12">
    <p class="text-gray-500 text-lg mb-4">Produit non trouve</p>
    <button class="bg-blue-600 text-white px-6 py-2 rounded-md hover:bg-blue-700 transition-colors" routerLink="/products">
      Retour au catalogue
    </button>
  </div>
</div>
