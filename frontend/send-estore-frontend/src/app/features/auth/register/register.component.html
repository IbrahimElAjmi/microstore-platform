<div class="min-h-screen flex items-center justify-center bg-[#f8fafc] py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8">
    <div class="bg-white shadow-lg rounded-xl p-8 border border-[#e2e8f0]">
      <div class="text-center mb-6">
        <h2 class="text-3xl font-bold text-[#0f172a]">Creer un compte</h2>
        <p class="text-[#64748b] mt-2">Le compte client sera connecte automatiquement</p>
      </div>
      
      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-6">
        <div>
          <label for="firstName" class="block text-sm font-medium text-[#0f172a] mb-2">First Name</label>
          <input 
            type="text" 
            class="w-full px-3 py-2 border border-[#e2e8f0] rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-[#2563eb] focus:border-[#2563eb] bg-white text-[#0f172a] placeholder-[#64748b]" 
            id="firstName" 
            formControlName="firstName"
            placeholder="Enter your first name"
          >
          <div class="mt-1 text-red-400 text-sm" *ngIf="registerForm.get('firstName')?.invalid && registerForm.get('firstName')?.touched">
            First name required
          </div>
        </div>
        
        <div>
          <label for="lastName" class="block text-sm font-medium text-[#0f172a] mb-2">Last Name</label>
          <input 
            type="text" 
            class="w-full px-3 py-2 border border-[#e2e8f0] rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-[#2563eb] focus:border-[#2563eb] bg-white text-[#0f172a] placeholder-[#64748b]" 
            id="lastName" 
            formControlName="lastName"
            placeholder="Enter your last name"
          >
          <div class="mt-1 text-red-400 text-sm" *ngIf="registerForm.get('lastName')?.invalid && registerForm.get('lastName')?.touched">
            Last name required
          </div>
        </div>
        
        <div>
          <label for="email" class="block text-sm font-medium text-[#0f172a] mb-2">Email</label>
          <input 
            type="email" 
            class="w-full px-3 py-2 border border-[#e2e8f0] rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-[#2563eb] focus:border-[#2563eb] bg-white text-[#0f172a] placeholder-[#64748b]" 
            id="email" 
            formControlName="email"
            placeholder="Enter your email"
          >
          <div class="mt-1 text-red-400 text-sm" *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">
            Invalid email
          </div>
        </div>
        
        <div>
          <label for="password" class="block text-sm font-medium text-[#0f172a] mb-2">Password</label>
          <input 
            type="password" 
            class="w-full px-3 py-2 border border-[#e2e8f0] rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-[#2563eb] focus:border-[#2563eb] bg-white text-[#0f172a] placeholder-[#64748b]" 
            id="password" 
            formControlName="password"
            placeholder="Enter your password"
          >
          <div class="mt-1 text-red-400 text-sm" *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched">
            Password required
          </div>
        </div>
        
        <!-- Hidden field for role -->
        <input type="hidden" formControlName="role">
        
        <div class="bg-[#fef2f2] border border-[#ef4444] text-[#991b1b] px-4 py-3 rounded-lg" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>
        
        <button 
          type="submit" 
          class="w-full bg-[#2563eb] text-white py-3 px-4 rounded-lg hover:bg-[#1d4ed8] focus:outline-none focus:ring-2 focus:ring-[#2563eb] focus:ring-offset-2 focus:ring-offset-white transition-colors disabled:bg-[#e2e8f0] disabled:cursor-not-allowed font-medium" 
          [disabled]="registerForm.invalid || isLoading"
        >
          {{ isLoading ? 'Creation...' : 'Creer et entrer' }}
        </button>
      </form>
      
      <div class="text-center mt-6 p-4 bg-white rounded-lg border border-[#e2e8f0]">
        <p class="text-[#64748b] mb-2">Already have an account?</p>
        <a routerLink="/login" class="inline-flex items-center text-[#2563eb] hover:text-[#1d4ed8] font-semibold transition-colors">
          <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3 3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path>
          </svg>
          Sign In Here
        </a>
      </div>
    </div>
  </div>
</div>
