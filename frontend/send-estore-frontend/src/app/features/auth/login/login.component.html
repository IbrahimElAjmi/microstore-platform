<div class="min-h-screen flex items-center justify-center bg-[#f8fafc] py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8">
    <div class="bg-white shadow-lg rounded-xl p-8 border border-[#e2e8f0]">
      <div class="text-center mb-6">
        <h2 class="text-3xl font-bold text-[#0f172a]">Connexion</h2>
        <p class="text-[#64748b] mt-2">Connecte-toi pour acceder a ton espace</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
        <div>
          <label for="email" class="block text-sm font-medium text-[#0f172a] mb-2">Email</label>
          <input 
            type="email" 
            class="w-full px-3 py-2 border border-[#e2e8f0] rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-[#2563eb] focus:border-[#2563eb] bg-white text-[#0f172a] placeholder-[#64748b]" 
            id="email" 
            formControlName="email"
            placeholder="client@estore.com"
          >
          <div class="mt-1 text-red-400 text-sm" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
            Invalid email
          </div>
        </div>
        
        <div>
          <label for="password" class="block text-sm font-medium text-[#0f172a] mb-2">Mot de passe</label>
          <input 
            type="password" 
            class="w-full px-3 py-2 border border-[#e2e8f0] rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-[#2563eb] focus:border-[#2563eb] bg-white text-[#0f172a] placeholder-[#64748b]" 
            id="password" 
            formControlName="password"
            placeholder="client123"
          >
          <div class="mt-1 text-red-400 text-sm" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
            Mot de passe obligatoire
          </div>
        </div>
        
        <div class="bg-[#fef2f2] border border-[#ef4444] text-[#991b1b] px-4 py-3 rounded-lg" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>
        
        <button 
          type="submit" 
          class="w-full bg-[#2563eb] text-white py-3 px-4 rounded-lg hover:bg-[#1d4ed8] focus:outline-none focus:ring-2 focus:ring-[#2563eb] focus:ring-offset-2 focus:ring-offset-white transition-colors disabled:bg-[#e2e8f0] disabled:cursor-not-allowed font-medium" 
          [disabled]="loginForm.invalid || isLoading"
        >
          {{ isLoading ? 'Connexion...' : 'Se connecter' }}
        </button>
      </form>
      
      <div class="text-center mt-6">
        <p class="text-[#64748b]">
          Pas encore de compte ?
          <a routerLink="/register" class="font-medium text-[#2563eb] hover:underline">
            Creer un compte
          </a>
        </p>
      </div>
    </div>
  </div>
</div>
